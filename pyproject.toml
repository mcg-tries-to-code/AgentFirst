[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfirst-v0"
version = "0.1.0"
description = "AgentFirst, a governed local-first multi-user agent operations prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentfirst = "agentfirst_storage.cli:main"
agentfirst-store = "agentfirst_storage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
